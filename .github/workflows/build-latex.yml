name: Compile

on:
  push:
    branches: [master, main]

env:
  PAPERS: ieee-paper standalone

jobs:
  compile-linux:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    concurrency:
      group: global
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - name: Compile papers
        run: |
          for paper in $PAPERS; do
            echo "::group::$paper"
            make -C "$paper"
            echo "::endgroup::"
          done

      - name: Copy PDFs to root with descriptive names
        run: |
          for paper in $PAPERS; do
            cp "$paper/main.pdf" "$paper.pdf"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: pdfs-linux
          path: |
            ieee-paper.pdf
            standalone.pdf

      - name: Update git tag
        run: |
          git config --global --add safe.directory $PWD
          git tag -f auto-compile
          git push -f origin auto-compile

      - uses: ncipollo/release-action@v1
        with:
          name: auto-compile
          tag: auto-compile
          body: automatically compiled on sha ${{ github.sha }}
          allowUpdates: true
          artifacts: "ieee-paper.pdf,standalone.pdf"
          prerelease: true

  compile-macos:
    runs-on: macos-latest
    concurrency:
      group: macos-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          packages: >
            scheme-medium
            latexmk
            collection-latexextra
            collection-fontsextra
            collection-pictures
            collection-bibtexextra

      - name: Compile papers
        run: |
          for paper in $PAPERS; do
            echo "::group::$paper"
            make -C "$paper"
            echo "::endgroup::"
          done

      - name: Copy PDFs to root with descriptive names
        run: |
          for paper in $PAPERS; do
            cp "$paper/main.pdf" "$paper.pdf"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: pdfs-macos
          path: |
            ieee-paper.pdf
            standalone.pdf
